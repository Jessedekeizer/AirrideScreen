; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio_secrets.ini

[common]
lib_deps =
    bodmer/TFT_eSPI@2.5.43
	lvgl/lvgl @ 9.5
    nitek/XPT2046_Bitbang_Slim@2.0.0
    symlink://../SharedLibraries/Communication
    symlink://../SharedLibraries/Logger
    symlink://../SharedLibraries/ICanBus
    symlink://../SharedLibraries/FreeRTOSPort
    symlink://../SharedLibraries/CanMessage
    symlink://../SharedLibraries/CanQueue
    symlink://../SharedLibraries/CanMessageIds
    symlink://../SharedLibraries/CanId
    symlink://../SharedLibraries/CanMessages
    symlink://../SharedLibraries/LargeCanMessage
    symlink://../SharedLibraries/LargeCanMessageHandler
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_BACKLIGHT_OFF=LOW
    -DSPI_FREQUENCY=80000000
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLOG_LEVEL=3
    -DSELF_OTA_SSID=\"${ota_secrets.ssid}\"
    -DSELF_OTA_PASS=\"${ota_secrets.pass}\"
    -DSELF_OTA_IP=\"${ota_secrets.ip}\"

; LVGL + runtime diagnostics. Only env:esp32dev-debug pulls these in.
; Every LV_* key here is #ifndef-guarded in include/lv_conf.h so -D wins.
; Deliberately NOT set:
;   LV_USE_MEM_MONITOR - needs LV_USE_STDLIB_MALLOC=LV_STDLIB_BUILTIN, which
;     swaps the real heap for a fixed LV_MEM_SIZE pool. DIAG_HEAP reports the
;     actual ESP32 heap LVGL allocates from, so it is the truer number here.
;   build_type=debug - -Og would skew the very FPS figures this env exists to
;     measure. Debug env stays optimised like release.
debug_flags =
    -DLV_USE_LOG=1
    -DLV_LOG_LEVEL=LV_LOG_LEVEL_WARN
    -DLV_USE_PERF_MONITOR=1
    -DLV_USE_PERF_MONITOR_LOG_MODE=0
    -DLV_USE_REFR_DEBUG=1
    -DLV_USE_ASSERT_OBJ=1
    -DLV_USE_ASSERT_MEM_INTEGRITY=1
    -DDIAG_HEAP=1

; Shared board build. PlatformIO applies [env] to every [env:*] automatically.
[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
; No-op on espressif32@6.5.0 + arduino: builder/main.py _get_board_flash_mode()
; downgrades qio -> dio unconditionally. Kept to document the intent.
board_build.flash_mode = qio
board_build.f_flash = 80000000L
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}

[env:esp32dev]

[env:esp32dev-ota]
upload_protocol = espota
upload_port = ${ota_secrets.ip}
extra_scripts = pre:../SharedLibraries/ota_upload.py

[env:esp32dev-debug]
build_flags = ${common.build_flags} ${common.debug_flags}
